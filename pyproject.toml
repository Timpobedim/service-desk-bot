[project]
name = "service-desk-bot"
version = "1.0.0"
description = "Бот приёма заявок в рабочем чате: свободный текст → заявка с категорией, срочностью и сроком"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.scripts]
desk = "desk.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=0.24",
    "ruff>=0.12",
    "mypy>=1.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "PT", "RUF", "DTZ", "ASYNC"]
# RUF001-003: в русских строках есть кириллица, похожая на латиницу, — это нормально.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]
"src/desk/demo.py" = ["S311"]  # синтетические данные, не криптография

[tool.ruff.lint.isort]
known-first-party = ["desk"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
